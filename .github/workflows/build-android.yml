name: Build MAGAZIN Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Prepare Capacitor Android project
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MAGAZIN-Android-debug.apk
          gh release create "$RELEASE_TAG" MAGAZIN-Android-debug.apk \
            --target "$COMMIT_SHA" \
            --title "MAGAZIN Android $RELEASE_TAG" \
            --notes "Автоматическая debug-сборка для коммита $COMMIT_SHA."
